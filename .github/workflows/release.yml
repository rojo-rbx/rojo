name: Release

# Trimmed for this fork: only the Windows exe. Upstream's full workflow also uploads the
# plugin to Roblox, which needs secrets this fork doesn't have.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build Release
        run: cargo build --release --locked --verbose --target ${{ env.TARGET }}

      # A failure here shows in the run but still publishes, so its log can be read and
      # judged before anyone uses the exe.
      - name: Test
        run: cargo test --locked --verbose
        continue-on-error: true
        timeout-minutes: 25

      - name: Publish Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ARTIFACT_NAME="rojo-${TAG_NAME#v}-windows-x86_64.zip"
          mkdir staging
          cp "target/$TARGET/release/rojo.exe" staging/
          (cd staging && 7z a "../$ARTIFACT_NAME" *)
          gh release create "$TAG_NAME" "$ARTIFACT_NAME" --verify-tag --title "$TAG_NAME" \
            --notes "Rojo 7.7.1 with one change: rojo serve no longer crashes when a watched path vanishes before its event is handled. Unofficial."
